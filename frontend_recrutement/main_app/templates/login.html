<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Connexion - Ninestars</title>
    <meta name="description" content="">
    <meta name="keywords" content="">
  
    <!-- Favicons -->
    <link href="{% static "assets/img/favicon.png" %}" rel="icon">
    <link href="{% static "assets/img/apple-touch-icon.png" %}" rel="apple-touch-icon">
  
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  
    <!-- Vendor CSS Files -->
    <link href="{% static "assets/vendor/bootstrap/css/bootstrap.min.css" %}" rel="stylesheet">
    <link href="{% static "assets/vendor/bootstrap-icons/bootstrap-icons.css" %}" rel="stylesheet">
    <link href="{% static "assets/vendor/aos/aos.css" rel="stylesheet" %}">
    <link href="{% static "assets/vendor/glightbox/css/glightbox.min.css" %}" rel="stylesheet">
    <link href="{% static "assets/vendor/swiper/swiper-bundle.min.css" %}" rel="stylesheet">
  
    <!-- Main CSS File -->
    <link href="{% static "assets/css/main.css" %}" rel="stylesheet">
  
    <!-- =======================================================
    * Template Name: Ninestars
    * Template URL: https://bootstrapmade.com/ninestars-free-bootstrap-3-theme-for-creative/
    * Updated: Aug 07 2024 with Bootstrap v5.3.3

    ======================================================== -->
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; }
      .main { flex: 1; }
      .footer { margin-top: auto; width: 100%; }
  </style>
  

</head>

<body class="index-page">

  <!-- Header (identique à index.html) -->
  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center">
      <a href="{% url 'index' %}" class="logo d-flex align-items-center me-auto">
        <h1 class="sitename">JobNest</h1>
      </a>
      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="{% url 'index' %}">Accueil</a></li>
          <li class="dropdown"><a href="#"><span>S'authentifier</span> <i class="bi bi-chevron-down toggle-dropdown"></i></a>
            <ul>
              <li><a href="{% url 'login' %}">Se connecter</a></li>
              <li><a href="{% url 'register' %}">S'inscrire</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="card">
              <div class="card-body">
                <h2 class="text-center mb-4">Connexion</h2>
                
                {% if error %}
                  <div class="alert alert-danger">
                    <p>{{error}}</p>
                  </div>
                {% endif %}
                <form id="login-form" class="login-form" action = "{% url "login" %}" method = "POST">
                  {% csrf_token %}
                
                  <div class="form-group mb-3">
                    <label for="login-email">Email</label>
                    <input name = "email" type="email" id="login-email" class="form-control" required />
                  </div>
                  <div class="form-group mb-3">
                    <label for="login-password">Mot de passe</label>
                    <input name = "password" type="password" id="login-password" class="form-control" required />
                  </div>
                  <button type="submit" class="btn btn-success w-100">Se connecter</button>
                </form>
                <div class="text-center mt-3">
                  <p>Pas encore de compte ? <a href="{% url 'register' %}">S'inscrire</a></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer (identique à index.html) -->
  <footer id="footer" class="footer position-relative">

    



    <div class="container copyright text-center mt-4">
      <p>© <span>Copyright</span> <strong class="px-1 sitename">JobNest</strong> <span>All Rights Reserved</span></p>
      <div class="credits">
        <!-- All the links in the footer should remain intact. -->
        <!-- You can delete the links only if you've purchased the pro version. -->
        <!-- Licensing information: https://bootstrapmade.com/license/ -->
        <!-- Purchase the pro version with working PHP/AJAX contact form: [buy-url] -->
        Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a>
      </div>
    </div>

  </footer>

  <!-- Scripts (identique à index.html) -->
  <!-- ... (tous les scripts de index.html) ... -->
   <!-- Vendor JS Files -->
  <script src="{% static "assets/vendor/bootstrap/js/bootstrap.bundle.min.js" %}"></script>
  <script src="{% static "assets/vendor/php-email-form/validate.js" %}"></script>
  <script src="{% static "assets/vendor/aos/aos.js" %}"></script>
  <script src="{% static "assets/vendor/glightbox/js/glightbox.min.js" %}"></script>
  <script src="{% static "assets/vendor/imagesloaded/imagesloaded.pkgd.min.js" %}"></script>
  <script src="{% static "assets/vendor/isotope-layout/isotope.pkgd.min.js" %}"></script>
  <script src="{% static "assets/vendor/swiper/swiper-bundle.min.js" %}"></script>

  <!-- Main JS File -->
  <script src="{% static "assets/js/main.js" %}"></script>

  

</body>
</html>
