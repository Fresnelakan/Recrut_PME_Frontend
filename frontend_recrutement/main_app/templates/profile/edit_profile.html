<!-- templates/profil/edit_profile.html -->
{% load static %} 
<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <title>Modifier Profil</title>
   <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet">
   <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
   <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
   <style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f4f6fc;
  margin: 0;
  padding: 0;
}

.get-in-touch {
  max-width: 900px;
  margin: 80px auto;
  padding: 50px 40px;
  background: #fff;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  position: relative;
}

.get-in-touch .title {
  text-align: center;
  font-size: 3em;
  font-weight: bold;
  text-transform: uppercase;
  background: linear-gradient(to right, #ff416c, #5543ca);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 40px;
  letter-spacing: 3px;
}

.contact-form {
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
}

.form-field {
  flex: 1 1 45%;
  position: relative;
}

.form-field.col-lg-12 {
  flex: 1 1 100%;
}

.input-text {
  width: 100%;
  padding: 15px 20px;
  border: 2px solid #5543ca;
  border-radius: 8px;
  font-size: 18px;
  transition: 0.3s;
  background-color: #f9f9f9;
}

.input-text:focus {
  outline: none;
  border-color: #ff416c;
  background-color: #fff;
  box-shadow: 0 0 8px rgba(85, 67, 202, 0.3);
}

.label {
  position: absolute;
  left: 20px;
  top: 18px;
  font-size: 16px;
  color: #5543ca;
  pointer-events: none;
  transition: 0.3s;
}

.input-text:focus + .label,
.input-text.not-empty + .label {
  top: -12px;
  left: 15px;
  font-size: 13px;
  background: #fff;
  padding: 0 5px;
  color: #ff416c;
}

.submit-btn {
  background-image: linear-gradient(125deg, #a72879, #064497);
  color: #fff;
  text-transform: uppercase;
  font-weight: bold;
  letter-spacing: 2px;
  padding: 15px 30px;
  font-size: 16px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: background 0.3s ease-in-out;
}

.submit-btn:hover {
  background-image: linear-gradient(125deg, #064497, #a72879);
}
</style>

</head>
<body>
   <section class="get-in-touch">
      <h1 class="title">Modifier Profil</h1>
      <form class="contact-form row">
        <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
        <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
        <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
        
        
        <section class="get-in-touch">
           <h1 class="title">Get in touch</h1>
           <form class="contact-form row">
              <div class="form-field col-lg-6">
                 <input id="name" class="input-text js-input" type="text" required>
                 <label class="label" for="name">Name</label>
              </div>
              <div class="form-field col-lg-6 ">
                 <input id="email" class="input-text js-input" type="email" required>
                 <label class="label" for="email">E-mail</label>
              </div>
              <div class="form-field col-lg-6 ">
                 <input id="company" class="input-text js-input" type="text" required>
                 <label class="label" for="company">Company Name</label>
              </div>
               <div class="form-field col-lg-6 ">
                 <input id="phone" class="input-text js-input" type="text" required>
                 <label class="label" for="phone">Contact Number</label>
              </div>
              <div class="form-field col-lg-12">
                 <input id="message" class="input-text js-input" type="text" required>
                 <label class="label" for="message">Message</label>
              </div>
              <div class="form-field col-lg-12">
                 <input class="submit-btn" type="submit" value="Submit">
              </div>
           </form>
        </section>
        
      </form>
   </section>
</body>
</html>
